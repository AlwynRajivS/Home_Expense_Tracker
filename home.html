<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Finance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#74ebd5,#ACB6E5)}
.wrapper{max-width:960px;margin:auto}
.box{background:#fff;margin:12px;padding:16px;border-radius:18px;box-shadow:0 8px 25px rgba(0,0,0,.2)}
label{font-size:13px;font-weight:600}
input,select,button{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:bold}
.hidden{display:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#f0f0f0}
.action-btn{padding:6px 10px;font-size:11px;border-radius:6px;color:#fff;border:none}
.del{background:#e53935}
h3{text-align:center;margin-top:15px}
.logout-wrap{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}

.logout-btn{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  border:none;
  color:#fff;
  padding:8px 20px;
  font-size:13px;
  font-weight:600;
  border-radius:30px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(255,75,43,.45);
  transition:.3s ease;
}

.logout-btn:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 10px 25px rgba(255,75,43,.65);
}

.logout-btn:active{
  transform:scale(.95);
}

/* TOAST */
.toast{
  position:fixed;
  bottom:-80px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#43cea2,#185a9d);
  color:#fff;
  padding:14px 22px;
  border-radius:40px;
  font-size:14px;
  font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  opacity:0;
  transition:all .5s ease;
  z-index:9999;
}

.toast.show{
  bottom:30px;
  opacity:1;
}

.toast.error{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
}


</style>
</head>

<body>


<div class="wrapper">

<!-- DASHBOARD -->
<div class="box">
<div class="logout-wrap">
  <button class="logout-btn" onclick="logout()">
    <span>Logout</span>
  </button>
</div>
<h2 id="user"></h2>

<label>From</label>
<input type="date" id="from">

<label>To</label>
<input type="date" id="to">

<button onclick="loadAll()">View</button>

<div class="cards">
  <div class="box">Income ₹<span id="inc">0</span></div>
  <div class="box">Expense ₹<span id="exp">0</span></div>
  <div class="box">Cash ₹<span id="cash">0</span></div>
  <div class="box">Bank ₹<span id="bank">0</span></div>
</div>

<h3>Opening Balance</h3>
<div class="cards">
  <div class="box">Cash ₹<span id="openCash">0</span></div>
  <div class="box">Bank ₹<span id="openBank">0</span></div>
</div>

<h3>Month-wise Income vs Expense</h3>
<canvas id="monthChart"></canvas>

<h3>Expense by Category</h3>
<canvas id="pieChart"></canvas>
</div>

<!-- ADD TRANSACTION -->
<div class="box">
<h3>Add Transaction</h3>

<label>Date</label>
<input type="date" id="date">

<label>Type</label>
<select id="type" onchange="logic()">
<option>Income</option>
<option>Expense</option>
<option>Transfer</option>
</select>

<label id="fromLbl" class="hidden">From</label>
<select id="fromAcc" class="hidden">
<option>Cash</option>
<option>Bank</option>
</select>

<label id="toLbl" class="hidden">To</label>
<select id="toAcc" class="hidden">
<option>Cash</option>
<option>Bank</option>
</select>

<label id="catLbl" class="hidden">Category</label>
<select id="cat" class="hidden"></select>

<label>Amount</label>
<input id="amt" type="number">

<label>Notes</label>
<input id="note">

<button onclick="save()">Save</button>
</div>

<!-- TRANSACTIONS -->
<div class="box">
<h3>Transactions</h3>
<div style="overflow-x:auto">
<table id="txTable"></table>
</div>
</div>

<!-- PDF -->
<div class="box">
<button onclick="downloadPDF()">📄 Download PDF (Date Range)</button>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyqzi7oZCdNEzyNJ_FZ_eXxWm3daWvi7cKT6ncPCXsNBKqLIl4IjZwcUL0QCbMdIZqdOA/exec";

/* SESSION */
const session=JSON.parse(sessionStorage.getItem("user")||"{}");
if(!session.name) location.href="index.html";
user.innerText="Welcome "+session.name;

let monthChartObj=null,pieChartObj=null;

/* FIELD LOGIC */
function logic(){
[fromAcc,toAcc,cat,fromLbl,toLbl,catLbl].forEach(e=>e.classList.add("hidden"));
if(type.value==="Income"){toAcc.classList.remove("hidden");toLbl.classList.remove("hidden")}
if(type.value==="Expense"){fromAcc.classList.remove("hidden");fromLbl.classList.remove("hidden");cat.classList.remove("hidden");catLbl.classList.remove("hidden")}
if(type.value==="Transfer"){fromAcc.classList.remove("hidden");toAcc.classList.remove("hidden");fromLbl.classList.remove("hidden");toLbl.classList.remove("hidden")}
}

/* LOAD CATEGORIES */
fetch(API+"?categories=1")
.then(r=>r.json())
.then(d=>cat.innerHTML=d.categories.map(c=>`<option>${c}</option>`).join(""));

/* SAVE */
function save(){
  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"save",
      data:{
        date:date.value,
        user:session.name,
        type:type.value,
        from:fromAcc.value,
        to:toAcc.value,
        category:cat.value,
        amount:amt.value,
        mode:fromAcc.value||toAcc.value,
        notes:note.value
      }
    })
  })
  .then(r=>r.json())
  .then(()=>{
    showToast("✅ Transaction saved successfully");

    amt.value="";
    note.value="";

    loadAll();
  })
  .catch(()=>{
    showToast("❌ Failed to save transaction","error");
  });
}


/* LOAD ALL */
function loadAll(){
loadDashboard();
loadBalances();
loadOpeningBalance();
loadMonthlyChart();
loadTable();
}

/* CURRENT BALANCE (FIXED) */
function loadBalances(){
let url=API+"?balances=1";
if(from.value && to.value) url+=`&from=${from.value}&to=${to.value}`;
fetch(url).then(r=>r.json()).then(b=>{
cash.innerText=b.cash||0;
bank.innerText=b.bank||0;
});
}

/* OPENING BALANCE (SAFE) */
function loadOpeningBalance(){
if(!from.value){
openCash.innerText=0;
openBank.innerText=0;
return;
}
const d=new Date(from.value);
d.setDate(d.getDate()-1);
const prev=d.toISOString().split("T")[0];

fetch(`${API}?balances=1&to=${prev}`)
.then(r=>r.json())
.then(b=>{
openCash.innerText=b.cash||0;
openBank.innerText=b.bank||0;
});
}

/* DASHBOARD */
function loadDashboard(){
if(!from.value||!to.value) return;
fetch(`${API}?dashboard=1&from=${from.value}&to=${to.value}`)
.then(r=>r.json()).then(d=>{
inc.innerText=d.inc||0;
exp.innerText=d.exp||0;

if(pieChartObj) pieChartObj.destroy();
pieChartObj=new Chart(pieChart,{
type:"pie",
data:{labels:Object.keys(d.cats||{}),datasets:[{data:Object.values(d.cats||{})}]}
});
});
}

/* MONTHLY */
function loadMonthlyChart(){
fetch(API+"?monthly=1")
.then(r=>r.json()).then(d=>{
const labels=Object.keys(d||{});
if(monthChartObj) monthChartObj.destroy();
monthChartObj=new Chart(monthChart,{
type:"bar",
data:{
labels,
datasets:[
{label:"Income",data:labels.map(k=>d[k].inc),backgroundColor:"#4CAF50"},
{label:"Expense",data:labels.map(k=>d[k].exp),backgroundColor:"#FF5252"}
]
},
options:{scales:{y:{beginAtZero:true}}}
});
});
}

/* TABLE */
function loadTable(){
if(!from.value||!to.value) return;
fetch(`${API}?transactions=1&from=${from.value}&to=${to.value}`)
.then(r=>r.json()).then(d=>{
let h='<tr><th>Date</th><th>User</th><th>Type</th><th>Category</th><th>Mode</th><th>Amount</th><th>Action</th></tr>';
d.data.forEach(r=>{
h+=`<tr>
<td>${r[0].split("T")[0]}</td>
<td>${r[1]}</td>
<td>${r[2]}</td>
<td>${r[5]||"-"}</td>
<td>${r[7]}</td>
<td>₹${r[6]}</td>
<td><button class="action-btn del" onclick="del(${r[9]})">Delete</button></td>
</tr>`;
});
txTable.innerHTML=h;
});
}

function del(row){
if(confirm("Delete transaction?")){
fetch(API,{method:"POST",body:JSON.stringify({action:"delete",data:{row}})})
.then(loadAll);
}
}

/* PDF */
function downloadPDF(){
if(!from.value||!to.value){
alert("Select From & To dates");
return;
}
fetch(`${API}?pdf=1&from=${from.value}&to=${to.value}`)
.then(r=>r.json())
.then(d=>window.open(d.url));
}
function logout(){
  sessionStorage.removeItem("user");
  location.href = "index.html";
}

/* INIT */
logic();
loadBalances();

<script>
function showToast(msg,type="success"){
  const t=document.getElementById("toast");
  t.innerText=msg;
  t.className="toast show"+(type==="error"?" error":"");

  setTimeout(()=>t.classList.remove("show"),3000);
}
</script>

</script>
<div id="toast" class="toast"></div>
</body>
</html>
