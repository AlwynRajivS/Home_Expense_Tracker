<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Finance Pro | Secure Login</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ---------- RESET ---------- */
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

/* ---------- ADVANCED BACKGROUND ---------- */
body{
  font-family:'Poppins','Inter',sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f0c29;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  overflow:hidden;
  position:relative;
}

/* Animated Gradient Background */
body::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 20% 30%,rgba(102,126,234,0.2) 0%,transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(245,87,108,0.15) 0%,transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(67,233,123,0.1) 0%,transparent 60%);
  animation:breathe 15s ease-in-out infinite;
  z-index:0;
}

@keyframes breathe{
  0%,100%{opacity:0.8;transform:scale(1)}
  50%{opacity:1;transform:scale(1.1)}
}

/* Particle Grid */
body::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-image:
    radial-gradient(circle at 15% 25%,rgba(255,255,255,0.08) 2px,transparent 2px),
    radial-gradient(circle at 85% 75%,rgba(255,255,255,0.06) 2px,transparent 2px),
    radial-gradient(circle at 45% 60%,rgba(255,255,255,0.05) 1px,transparent 1px),
    radial-gradient(circle at 65% 40%,rgba(255,255,255,0.07) 1.5px,transparent 1.5px);
  background-size:300px 300px,400px 400px,250px 250px,350px 350px;
  animation:particles 80s linear infinite;
  opacity:0.6;
  z-index:0;
}

@keyframes particles{
  0%{transform:translate(0,0)}
  100%{transform:translate(50px,50px)}
}

/* ---------- FLOATING ORBS ---------- */
.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  opacity:0.5;
  animation:float-orb 20s infinite ease-in-out;
  z-index:1;
}

.orb.one{
  width:400px;
  height:400px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  top:-100px;
  left:-100px;
  animation-duration:18s;
}

.orb.two{
  width:350px;
  height:350px;
  background:linear-gradient(135deg,#f093fb,#f5576c);
  bottom:-100px;
  right:-100px;
  animation-delay:3s;
  animation-duration:22s;
}

.orb.three{
  width:300px;
  height:300px;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  top:50%;
  left:50%;
  animation-delay:6s;
  animation-duration:20s;
}

.orb.four{
  width:250px;
  height:250px;
  background:linear-gradient(135deg,#43e97b,#38f9d7);
  top:20%;
  right:10%;
  animation-delay:9s;
  animation-duration:25s;
}

@keyframes float-orb{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(50px,-50px) scale(1.1)}
  50%{transform:translate(-30px,-80px) scale(0.9)}
  75%{transform:translate(70px,-30px) scale(1.05)}
}

/* ---------- STARS ---------- */
.stars{
  position:absolute;
  width:100%;
  height:100%;
  z-index:1;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 10px rgba(255,255,255,0.8);
  animation:twinkle 3s infinite;
}

@keyframes twinkle{
  0%,100%{opacity:0.3}
  50%{opacity:1}
}

/* ---------- LOGIN CONTAINER ---------- */
.login-container{
  position:relative;
  z-index:10;
  perspective:1000px;
  animation:float-in 1s ease-out;
}

@keyframes float-in{
  from{
    opacity:0;
    transform:translateY(50px) scale(0.9);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* ---------- LOGIN CARD ---------- */
.login-card{
  position:relative;
  width:90vw;
  max-width:460px;
  padding:50px 45px;
  border-radius:32px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(40px) saturate(180%);
  box-shadow:
    0 30px 90px rgba(0,0,0,0.5),
    inset 0 2px 0 rgba(255,255,255,0.2),
    0 0 0 1px rgba(255,255,255,0.1);
  text-align:center;
  overflow:hidden;
  transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
}

.login-card:hover{
  transform:translateY(-5px);
  box-shadow:
    0 40px 120px rgba(0,0,0,0.6),
    inset 0 2px 0 rgba(255,255,255,0.3),
    0 0 0 1px rgba(255,255,255,0.15);
}

/* Shimmer Effect */
.login-card::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  animation:shimmer 3s infinite;
}

@keyframes shimmer{
  0%{left:-100%}
  50%,100%{left:100%}
}

/* Rotating Gradient Border */
.login-card::after{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:conic-gradient(
    from 0deg,
    transparent 0deg,
    rgba(102,126,234,0.4) 90deg,
    rgba(245,87,108,0.4) 180deg,
    rgba(67,233,123,0.4) 270deg,
    transparent 360deg
  );
  animation:rotate-border 8s linear infinite;
  z-index:-1;
}

@keyframes rotate-border{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* ---------- LOGO ---------- */
.logo{
  font-size:72px;
  margin-bottom:8px;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,0.4));
  animation:bounce 2s ease-in-out infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-10px) scale(1.05)}
}

/* ---------- TEXT ---------- */
.login-card h1{
  margin:0 0 8px 0;
  font-weight:800;
  color:#fff;
  font-size:36px;
  letter-spacing:-1px;
  text-shadow:0 4px 20px rgba(0,0,0,0.5);
  background:linear-gradient(135deg,#fff,rgba(255,255,255,0.8));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.tagline{
  margin:0 0 40px;
  font-size:15px;
  color:rgba(255,255,255,0.85);
  font-weight:500;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.tagline span{
  display:inline-block;
  margin:0 8px;
  color:#43e97b;
  font-weight:700;
}

/* ---------- INPUT GROUP ---------- */
.input-group{
  position:relative;
  margin-bottom:28px;
}

.input-icon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:20px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  z-index:2;
}

.login-card input{
  width:100%;
  padding:18px 20px 18px 56px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,0.15);
  outline:none;
  font-size:16px;
  font-weight:500;
  background:rgba(255,255,255,0.08);
  color:#fff;
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.2);
  font-family:'Inter',sans-serif;
}

.login-card input::placeholder{
  color:rgba(255,255,255,0.5);
  font-weight:500;
}

.login-card input:focus{
  transform:translateY(-2px);
  border-color:rgba(102,126,234,0.8);
  background:rgba(255,255,255,0.12);
  box-shadow:
    0 0 0 5px rgba(102,126,234,0.15),
    inset 0 2px 8px rgba(0,0,0,0.2),
    0 8px 24px rgba(102,126,234,0.3);
}

/* ---------- BUTTON ---------- */
.login-card button{
  width:100%;
  padding:18px;
  margin-top:12px;
  border-radius:18px;
  border:none;
  font-size:17px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg,#667eea,#764ba2);
  box-shadow:
    0 12px 32px rgba(102,126,234,0.5),
    inset 0 2px 0 rgba(255,255,255,0.3);
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
  text-transform:uppercase;
  letter-spacing:1.5px;
  position:relative;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

.login-card button::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  transform:translate(-50%,-50%);
  transition:width 0.6s,height 0.6s;
}

.login-card button:hover::before{
  width:400px;
  height:400px;
}

.login-card button:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:
    0 16px 48px rgba(102,126,234,0.7),
    inset 0 2px 0 rgba(255,255,255,0.4);
}

.login-card button:active{
  transform:translateY(-2px) scale(0.98);
}

/* ---------- DIVIDER ---------- */
.divider{
  display:flex;
  align-items:center;
  margin:32px 0;
  color:rgba(255,255,255,0.5);
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
}

.divider span{
  padding:0 16px;
}

/* ---------- FEATURES ---------- */
.features{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px;
  margin-top:32px;
}

.feature{
  padding:16px 8px;
  background:rgba(255,255,255,0.05);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.1);
  transition:all 0.3s ease;
  backdrop-filter:blur(10px);
}

.feature:hover{
  transform:translateY(-4px);
  background:rgba(102,126,234,0.15);
  border-color:rgba(102,126,234,0.3);
  box-shadow:0 8px 24px rgba(102,126,234,0.3);
}

.feature-icon{
  font-size:28px;
  margin-bottom:8px;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.feature-text{
  font-size:12px;
  font-weight:600;
  color:rgba(255,255,255,0.8);
  text-transform:uppercase;
  letter-spacing:0.5px;
}

/* ---------- HINT ---------- */
.hint{
  margin-top:28px;
  padding:16px;
  background:rgba(67,233,123,0.1);
  border-radius:16px;
  border:1px solid rgba(67,233,123,0.2);
  font-size:13px;
  color:rgba(255,255,255,0.9);
  font-weight:600;
  letter-spacing:0.5px;
  backdrop-filter:blur(10px);
  box-shadow:0 4px 12px rgba(67,233,123,0.15);
}

.hint::before{
  content:'✓';
  display:inline-block;
  margin-right:8px;
  color:#43e97b;
  font-size:16px;
  font-weight:800;
}

/* ---------- FOOTER ---------- */
.footer{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,0.5);
  font-size:12px;
  font-weight:500;
  text-align:center;
  z-index:10;
  letter-spacing:0.5px;
}

/* ---------- LOADING ANIMATION ---------- */
.loading{
  pointer-events:none;
  opacity:0.6;
}

.loading::after{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:40px;
  height:40px;
  margin:-20px 0 0 -20px;
  border:4px solid rgba(255,255,255,0.2);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:600px){
  .login-card{
    padding:40px 30px;
  }
  
  .login-card h1{
    font-size:30px;
  }
  
  .logo{
    font-size:60px;
  }
  
  .tagline{
    font-size:13px;
  }
  
  .features{
    grid-template-columns:1fr;
    gap:12px;
  }
}

/* ---------- FADE OUT ---------- */
.fade-out{
  animation:fadeOut 0.5s forwards;
}

@keyframes fadeOut{
  to{
    opacity:0;
    transform:scale(0.95);
  }
}
</style>
</head>

<body>

<!-- Floating Orbs -->
<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>
<div class="orb four"></div>

<!-- Stars -->
<div class="stars">
  <div class="star" style="top:10%;left:20%;animation-delay:0s"></div>
  <div class="star" style="top:30%;left:70%;animation-delay:0.5s"></div>
  <div class="star" style="top:60%;left:15%;animation-delay:1s"></div>
  <div class="star" style="top:80%;left:80%;animation-delay:1.5s"></div>
  <div class="star" style="top:25%;left:50%;animation-delay:2s"></div>
  <div class="star" style="top:70%;left:40%;animation-delay:2.5s"></div>
  <div class="star" style="top:15%;left:85%;animation-delay:3s"></div>
  <div class="star" style="top:90%;left:25%;animation-delay:3.5s"></div>
</div>

<!-- LOGIN CONTAINER -->
<div class="login-container">
  <div class="login-card" id="loginCard">
    <div class="logo">💎</div>
    <h1>Home Finance Pro</h1>
    <p class="tagline">Smart<span>•</span>Secure<span>•</span>Simple</p>

    <div class="input-group">
      <div class="input-icon">🔐</div>
      <input id="pin" type="password" placeholder="Enter Your Secure PIN" maxlength="10">
    </div>

    <button onclick="login()">Sign In</button>

   <!-- <div class="divider">
      <span>Features</span>
    </div> -->

    <!--<div class="features">
      <div class="feature">
        <div class="feature-icon">📊</div>
        <div class="feature-text">Analytics</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <div class="feature-text">Secure</div>
      </div>
      <div class="feature">
        <div class="feature-icon">👥</div>
        <div class="feature-text">Multi-User</div>
      </div>
    </div>-->

    <div class="hint">Admin & User Access Enabled</div>
  </div>
</div>

<div class="footer">
  © 2024 Home Finance Pro • All Rights Reserved
</div>

<script>
/* ---------- CONFIG ---------- */
const API = "https://script.google.com/macros/s/AKfycbxCmZhdadqBbMRQNUDNRhpEJ0IsuNnHZzoUCqizonj45B8s4h7pGuKVF0kNJGq-fcOvgA/exec";

/* ---------- ENTER KEY SUPPORT ---------- */
document.getElementById('pin').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){
    login();
  }
});

/* ---------- LOGIN ---------- */
function login(){
  const pinInput = document.getElementById('pin');
  const loginCard = document.getElementById('loginCard');
  
  if(!pinInput.value){
    // Shake animation for empty input
    loginCard.style.animation = 'shake 0.5s';
    setTimeout(() => {
      loginCard.style.animation = '';
    }, 500);
    
    pinInput.focus();
    return;
  }

  // Add loading state
  loginCard.classList.add('loading');

  fetch(API + "?login=" + pinInput.value)
  .then(res => res.text())
  .then(txt => {
    let data;
    try{ 
      data = JSON.parse(txt); 
    }
    catch{
      loginCard.classList.remove('loading');
      showError("Server error. Please try again.");
      return;
    }

    if(!data.success){
      loginCard.classList.remove('loading');
      loginCard.style.animation = 'shake 0.5s';
      setTimeout(() => {
        loginCard.style.animation = '';
      }, 500);
      showError("❌ Invalid PIN");
      return;
    }

    // Save session
    sessionStorage.setItem("user", JSON.stringify(data));

    // Success animation
    loginCard.classList.remove('loading');
    document.body.classList.add('fade-out');
    
    setTimeout(() => { 
      window.location.href = "home.html"; 
    }, 500);
  })
  .catch(err => {
    loginCard.classList.remove('loading');
    showError("Connection error. Please try again.");
  });
}

/* ---------- ERROR NOTIFICATION ---------- */
function showError(message){
  // Create toast notification
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: white;
    padding: 16px 32px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 12px 40px rgba(238, 90, 111, 0.6);
    z-index: 10000;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 2px solid rgba(255, 255, 255, 0.2);
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.transform = 'translateX(-50%) translateY(0)';
  }, 100);
  
  setTimeout(() => {
    toast.style.transform = 'translateX(-50%) translateY(100px)';
    setTimeout(() => {
      document.body.removeChild(toast);
    }, 500);
  }, 3000);
}

/* ---------- SHAKE ANIMATION ---------- */
const style = document.createElement('style');
style.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
`;
document.head.appendChild(style);

/* ---------- AUTO FOCUS ---------- */
window.addEventListener('load', () => {
  document.getElementById('pin').focus();
});
</script>

</body>
</html>
