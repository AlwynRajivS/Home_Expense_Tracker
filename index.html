<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NDR Finova</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary:    #1a6b4a;
  --primary-lt: #2d9969;
  --primary-xl: #e8f7f1;
  --accent:     #f0a500;
  --surface:    #ffffff;
  --surface-2:  #f6f9f7;
  --border:     rgba(26,107,74,0.15);
  --border-mid: rgba(26,107,74,0.25);
  --text-h:     #0d2b1e;
  --text-b:     #2c4a3a;
  --text-m:     #6b8f7e;
  --text-l:     #9cb8ac;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}

body{
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  background:#eef6f1;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* ── BACKGROUND ── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 15%, rgba(200,238,220,0.75) 0%, transparent 55%),
    radial-gradient(ellipse 65% 70% at 90% 85%, rgba(195,232,214,0.55) 0%, transparent 55%),
    radial-gradient(ellipse 100% 80% at 50% 50%, #eef6f1 0%, #e5f2ea 100%);
}

.blob{
  position:absolute;border-radius:50%;filter:blur(72px);opacity:0.6;
  animation:blob-move 20s ease-in-out infinite;
}
.b1{width:55vw;height:55vw;background:radial-gradient(circle,rgba(45,153,105,0.2),transparent 70%);top:-12vw;left:-12vw;animation-duration:22s;}
.b2{width:45vw;height:45vw;background:radial-gradient(circle,rgba(240,165,0,0.13),transparent 70%);bottom:-8vw;right:-8vw;animation-delay:-8s;animation-duration:26s;}
.b3{width:38vw;height:38vw;background:radial-gradient(circle,rgba(26,107,74,0.09),transparent 70%);top:45%;left:55%;animation-delay:-14s;animation-duration:24s;}

@keyframes blob-move{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(4vw,-4vw) scale(1.08);}
  66%{transform:translate(-3vw,3vw) scale(0.93);}
}

/* floating rings */
.rings{position:fixed;inset:0;z-index:1;pointer-events:none;}
.ring{
  position:absolute;border-radius:50%;
  border:1.5px solid rgba(26,107,74,0.1);
  animation:ring-float 25s ease-in-out infinite;
}
.ring::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(26,107,74,0.04) 1px,transparent 1px);
  background-size:16px 16px;
}
.r1{width:200px;height:200px;top:6%;left:4%;animation-delay:0s;}
.r2{width:140px;height:140px;top:12%;right:6%;animation-delay:-6s;animation-duration:30s;}
.r3{width:100px;height:100px;bottom:18%;left:6%;animation-delay:-11s;animation-duration:22s;}
.r4{width:220px;height:220px;bottom:8%;right:4%;animation-delay:-16s;animation-duration:28s;}
.r5{width:70px;height:70px;top:48%;left:2%;animation-delay:-9s;border-radius:16px;transform:rotate(25deg);}

@keyframes ring-float{
  0%,100%{transform:translateY(0) rotate(0deg);opacity:0.75;}
  50%{transform:translateY(-18px) rotate(7deg);opacity:1;}
}

/* particle canvas */
#ptc{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ── PAGE ── */
.page{
  position:relative;z-index:10;
  width:100%;min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px 16px 48px;
}

/* ── CARD ── */
.card{
  width:100%;max-width:430px;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(44px) saturate(170%);
  -webkit-backdrop-filter:blur(44px) saturate(170%);
  border:1px solid rgba(255,255,255,0.92);
  border-radius:28px;
  padding:50px 42px 42px;
  position:relative;overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(26,107,74,0.07),
    0 24px 72px rgba(26,107,74,0.15),
    0 6px 20px rgba(0,0,0,0.06),
    inset 0 1px 0 #fff;
  animation:rise 1s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes rise{
  from{opacity:0;transform:translateY(42px) scale(0.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* top accent bar */
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--primary),var(--primary-lt),var(--accent));
  border-radius:28px 28px 0 0;
}

/* inner soft glow */
.card::after{
  content:'';position:absolute;
  top:-30%;left:-10%;width:120%;height:70%;
  background:radial-gradient(ellipse,rgba(26,107,74,0.04) 0%,transparent 70%);
  pointer-events:none;
}

/* ── LOGO ── */
.logo-area{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:26px;
  animation:rise 1s 0.09s cubic-bezier(0.16,1,0.3,1) both;
}
.logo-ring{
  position:relative;width:70px;height:70px;
  display:flex;align-items:center;justify-content:center;
}
.logo-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(white,white) padding-box,
    conic-gradient(from 0deg,var(--primary),var(--primary-lt),var(--accent),var(--primary)) border-box;
  animation:spin-r 7s linear infinite;
}
@keyframes spin-r{to{transform:rotate(360deg);}}
.logo-inner{
  width:52px;height:52px;
  background:linear-gradient(140deg,var(--primary),var(--primary-lt));
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(26,107,74,0.4),inset 0 1px 0 rgba(255,255,255,0.3);
  animation:logo-glow 3s ease-in-out infinite;
}
@keyframes logo-glow{
  0%,100%{box-shadow:0 8px 28px rgba(26,107,74,0.4),inset 0 1px 0 rgba(255,255,255,0.3);}
  50%{box-shadow:0 14px 40px rgba(26,107,74,0.55),inset 0 1px 0 rgba(255,255,255,0.4);}
}
.logo-svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ── BRAND TEXT ── */
.brand{
  text-align:center;margin-bottom:30px;
  animation:rise 1s 0.16s cubic-bezier(0.16,1,0.3,1) both;
}
.brand h1{
  font-family:'Playfair Display',serif;
  font-size:36px;font-weight:700;
  color:var(--text-h);letter-spacing:1px;
  margin-bottom:10px;line-height:1.1;
}
.brand h1 em{
  font-style:normal;
  background:linear-gradient(135deg,var(--primary),var(--primary-lt));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.tagline{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:10.5px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;color:var(--text-m);
}
.tdot{width:3px;height:3px;background:var(--accent);border-radius:50%;}

/* ── DIVIDER ── */
.divider{
  display:flex;align-items:center;gap:12px;margin-bottom:22px;
  animation:rise 1s 0.22s cubic-bezier(0.16,1,0.3,1) both;
}
.dl{flex:1;height:1px;background:var(--border);}
.dlabel{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-l);}

/* ── FIELD ── */
.fw{
  margin-bottom:18px;
  animation:rise 1s 0.28s cubic-bezier(0.16,1,0.3,1) both;
}
.flabel{
  display:block;font-size:11px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--text-m);margin-bottom:9px;
}
.fi{position:relative;}
.ficon{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;pointer-events:none;
}
.ficon svg{width:17px;height:17px;fill:none;stroke:var(--text-l);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;}

input#pin{
  width:100%;
  padding:16px 18px 16px 48px;
  background:var(--surface-2);
  border:1.5px solid var(--border);
  border-radius:14px;
  font-family:'Outfit',sans-serif;
  font-size:16px;font-weight:400;
  color:var(--text-h);letter-spacing:4px;
  outline:none;-webkit-appearance:none;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  caret-color:var(--primary);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.03);
}
input#pin::placeholder{letter-spacing:1px;font-size:14px;color:var(--text-l);font-weight:300;}
input#pin:focus{
  border-color:var(--primary);background:#fff;
  box-shadow:0 0 0 4px rgba(26,107,74,0.1),inset 0 2px 6px rgba(0,0,0,0.02);
  transform:translateY(-1px);
}
.fi:focus-within .ficon svg{stroke:var(--primary);}

/* pin dots */
.pdots{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:0;overflow:hidden;margin-top:0;
  transition:height .4s cubic-bezier(.4,0,.2,1),margin .4s;
}
.pdots.on{height:28px;margin-top:10px;}
.pd{
  width:8px;height:8px;border-radius:50%;
  background:var(--border-mid);
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.pd.lit{background:var(--primary);transform:scale(1.25);box-shadow:0 2px 10px rgba(26,107,74,0.45);}

/* ── BUTTON ── */
.btn-area{animation:rise 1s 0.34s cubic-bezier(0.16,1,0.3,1) both;}
button.s{
  width:100%;padding:17px 24px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-lt) 100%);
  border:none;border-radius:14px;color:#fff;
  font-family:'Outfit',sans-serif;font-size:12.5px;font-weight:700;
  letter-spacing:3.5px;text-transform:uppercase;
  cursor:pointer;position:relative;overflow:hidden;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 26px rgba(26,107,74,0.38),inset 0 1px 0 rgba(255,255,255,0.25);
}
button.s::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transform:skewX(-20deg);transition:left .6s;
}
button.s:hover::before{left:150%;}
button.s:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(26,107,74,0.48),inset 0 1px 0 rgba(255,255,255,0.3);}
button.s:active{transform:translateY(0) scale(0.99);}

.bt{display:inline-block;transition:opacity .2s;}
button.s.ld .bt{opacity:0;}
button.s.ld::after{
  content:'';position:absolute;top:50%;left:50%;
  width:20px;height:20px;margin:-10px 0 0 -10px;
  border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;
  border-radius:50%;animation:sp .75s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg);}}

.ripple{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,0.3);
  transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none;
}
@keyframes rp{to{transform:scale(4);opacity:0;}}

/* ── BADGE ── */
.badge-row{
  display:flex;align-items:center;justify-content:center;
  margin-top:22px;
  animation:rise 1s 0.42s cubic-bezier(0.16,1,0.3,1) both;
}
.badge{
  display:flex;align-items:center;gap:6px;
  padding:7px 15px;
  background:var(--primary-xl);
  border:1px solid rgba(26,107,74,0.15);
  border-radius:50px;
  font-size:10.5px;font-weight:600;letter-spacing:.5px;
  color:var(--primary);
}
.ldot{
  width:6px;height:6px;background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 0 0 rgba(34,197,94,.4);
  animation:lp 2s ease-in-out infinite;
}
@keyframes lp{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.4);}
  70%{box-shadow:0 0 0 6px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}

/* ── FOOTER ── */
.foot{
  position:fixed;bottom:0;left:0;right:0;
  text-align:center;padding:14px;
  font-size:10.5px;font-weight:400;
  letter-spacing:1px;color:var(--text-l);z-index:10;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:36px;left:50%;
  transform:translateX(-50%) translateY(80px);
  padding:13px 26px;border-radius:50px;
  font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;
  border:1px solid transparent;z-index:9999;white-space:nowrap;
  pointer-events:none;opacity:0;backdrop-filter:blur(16px);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .45s;
}
.toast.error{background:rgba(255,248,248,.96);border-color:rgba(220,60,60,.2);color:#c0392b;box-shadow:0 8px 32px rgba(220,60,60,.15);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* ── SHAKE ── */
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-9px);}
  40%{transform:translateX(9px);}
  60%{transform:translateX(-5px);}
  80%{transform:translateX(5px);}
}
.shaking{animation:shake .42s ease;}

/* ── FADE OUT ── */
.fade-out{animation:pgout .55s ease forwards;}
@keyframes pgout{to{opacity:0;transform:scale(1.02);}}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .card{padding:38px 24px 32px;border-radius:22px;}
  .brand h1{font-size:28px;}
  .logo-inner{width:46px;height:46px;}
  .logo-ring{width:62px;height:62px;}
}
@media(max-width:360px){
  .card{padding:32px 18px 28px;}
  .brand h1{font-size:24px;}
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- Floating rings -->
<div class="rings">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="ring r4"></div>
  <div class="ring r5"></div>
</div>

<!-- Particles -->
<canvas id="ptc"></canvas>

<!-- Page -->
<div class="page">
  <div class="card" id="loginCard">

    <!-- Logo -->
    <div class="logo-area">
      <div class="logo-ring">
        <div class="logo-inner">
          <svg class="logo-svg" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Brand -->
    <div class="brand">
      <h1>NDR <em>Finova</em></h1>
      <div class="tagline">
        <span>Smart</span><div class="tdot"></div>
        <span>Secure</span><div class="tdot"></div>
        <span>Simple</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <div class="dl"></div>
      <span class="dlabel">Secure Login</span>
      <div class="dl"></div>
    </div>

    <!-- PIN Field -->
    <div class="fw">
      <label class="flabel" for="pin">Access PIN</label>
      <div class="fi">
        <div class="ficon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <input id="pin" type="password" placeholder="Enter your secure PIN" maxlength="10" autocomplete="current-password">
      </div>
      <div class="pdots" id="pdots">
        <div class="pd" id="d0"></div>
        <div class="pd" id="d1"></div>
        <div class="pd" id="d2"></div>
        <div class="pd" id="d3"></div>
        <div class="pd" id="d4"></div>
        <div class="pd" id="d5"></div>
      </div>
    </div>

    <!-- Button -->
    <div class="btn-area">
      <button class="s" id="signinBtn" onclick="login()">
        <span class="bt">Sign In</span>
      </button>
    </div>

    <!-- Badge -->
    <div class="badge-row">
      <div class="badge">
        <span class="ldot"></span>
        Admin &amp; User Access Enabled
      </div>
    </div>

  </div>
</div>

<div class="foot">© 2024 NDR Finova &nbsp;·&nbsp; All Rights Reserved</div>

<script>
/* ── API ── */
const API="https://script.google.com/macros/s/AKfycbxCmZhdadqBbMRQNUDNRhpEJ0IsuNnHZzoUCqizonj45B8s4h7pGuKVF0kNJGq-fcOvgA/exec";

/* ── PARTICLES ── */
(function(){
  const c=document.getElementById('ptc'),cx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  function init(){
    pts=[];
    const n=Math.min(50,Math.floor((W*H)/22000));
    for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.5+.4,o:Math.random()*.5+.2});
  }
  function frame(){
    cx.clearRect(0,0,W,H);
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<115){cx.beginPath();cx.strokeStyle=`rgba(26,107,74,${.09*(1-d/115)})`;cx.lineWidth=.8;cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke();}
    }
    for(const p of pts){
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=`rgba(26,107,74,${p.o*.38})`;cx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    }
    requestAnimationFrame(frame);
  }
  resize();init();frame();
  window.addEventListener('resize',()=>{resize();init();});
})();

/* ── PIN DOTS ── */
const pinEl=document.getElementById('pin');
const pdots=document.getElementById('pdots');
const dots=Array.from(pdots.querySelectorAll('.pd'));
pinEl.addEventListener('input',()=>{
  const l=pinEl.value.length;
  pdots.classList.toggle('on',l>0);
  dots.forEach((d,i)=>d.classList.toggle('lit',i<l));
});

/* ── ENTER ── */
pinEl.addEventListener('keypress',e=>{if(e.key==='Enter')login();});

/* ── RIPPLE ── */
document.getElementById('signinBtn').addEventListener('pointerdown',function(e){
  const r=document.createElement('span');r.className='ripple';
  const rect=this.getBoundingClientRect(),s=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-rect.left-s/2}px;top:${e.clientY-rect.top-s/2}px`;
  this.appendChild(r);setTimeout(()=>r.remove(),700);
});

/* ── LOGIN ── */
function login(){
  const card=document.getElementById('loginCard');
  const btn=document.getElementById('signinBtn');
  if(!pinEl.value.trim()){
    card.classList.add('shaking');setTimeout(()=>card.classList.remove('shaking'),500);
    pinEl.focus();return;
  }
  btn.classList.add('ld');btn.disabled=true;
  fetch(API+"?login="+encodeURIComponent(pinEl.value))
    .then(r=>r.text())
    .then(txt=>{
      let data;
      try{data=JSON.parse(txt);}catch{rst(btn);showToast("Server error. Please try again.");return;}
      if(!data.success){
        rst(btn);
        card.classList.add('shaking');setTimeout(()=>card.classList.remove('shaking'),500);
        showToast("Invalid PIN. Please try again.");
        pinEl.value='';pdots.classList.remove('on');dots.forEach(d=>d.classList.remove('lit'));
        pinEl.focus();return;
      }
      sessionStorage.setItem("user",JSON.stringify(data));
      btn.classList.remove('ld');
      document.body.classList.add('fade-out');
      setTimeout(()=>{window.location.href="home.html";},550);
    })
    .catch(()=>{rst(btn);showToast("Connection error. Please try again.");});
}

function rst(btn){btn.classList.remove('ld');btn.disabled=false;}

/* ── TOAST ── */
function showToast(msg){
  let t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');t.className='toast error';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

/* ── AUTOFOCUS ── */
window.addEventListener('load',()=>pinEl.focus());
</script>
</body>
</html>
